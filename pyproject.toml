[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "xnlinkfinder"
dynamic = ["version"]
description = "Advanced endpoint discovery and security testing tool"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "@xnl-h4ck3r", email = ""},
]
maintainers = [
    {name = "Zeid Mahmoud", email = ""},
]
keywords = ["security", "endpoint-discovery", "bug-bounty", "penetration-testing", "reconnaissance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.0",
    "termcolor>=2.3.0",
    "urlparse3>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "html5lib>=1.1",
    "urllib3>=2.0.0",
    "tldextract>=5.0.0",
    "inflect>=7.3.0",
    "playwright>=1.40.0",
    "pypdf>=3.17.0",
    "aiohttp>=3.9.0",
    "aiodns>=3.1.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "regex>=2023.0.0",
    "jinja2>=3.1.0",
    "bloom-filter2>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "python-dateutil>=2.8.0",
    "pyjwt>=2.8.0",
    "dnspython>=2.4.0",
    "websocket-client>=1.6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "questionary>=2.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
    "safety>=2.3.5",
]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
integrations = [
    "slack-sdk>=3.21.0",
    "discord.py>=2.3.0",
    "python-telegram-bot>=20.0",
    "waybackpy>=3.0.6",
    "shodan>=1.28.0",
]
visualization = [
    "networkx>=3.1",
    "pyvis>=0.3.0",
    "matplotlib>=3.7.0",
    "reportlab>=4.0.0",
]
distributed = [
    "redis>=4.5.0",
    "pika>=1.3.0",
    "celery>=5.3.0",
    "kubernetes>=27.0.0",
]
all = [
    "xnlinkfinder[dev,ai,integrations,visualization,distributed]",
]

[project.urls]
Homepage = "https://github.com/ZeidMahmoud/xnLinkFinder-Z"
Documentation = "https://zeidmahmoud.github.io/xnLinkFinder-Z/"
Repository = "https://github.com/ZeidMahmoud/xnLinkFinder-Z"
Issues = "https://github.com/ZeidMahmoud/xnLinkFinder-Z/issues"

[project.scripts]
xnLinkFinder = "xnLinkFinder.xnLinkFinder:main"

[tool.setuptools]
packages = ["xnLinkFinder"]

[tool.setuptools_scm]
write_to = "xnLinkFinder/_version.py"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=xnLinkFinder --cov-report=term-missing --cov-report=html --cov-report=xml"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["xnLinkFinder"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
