# Reconnaissance Preset
# Fast discovery with minimal intrusion

name: "Reconnaissance"
description: "Quick and quiet reconnaissance"

settings:
  # Crawling
  depth: 2
  timeout: 15
  max_threads: 5
  follow_redirects: false
  
  # Discovery
  wayback: true
  commoncrawl: true
  github_search: false
  
  # Filters
  include_subdomains: true
  scope_only: true
  exclude_extensions:
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .svg
    - .ico
    - .css
    - .js
    - .woff
    - .woff2
    - .ttf
  
  # Output
  verbose: false
  save_all: true
  deduplicate: true

targets:
  # Passive only
  - none

scanners:
  enabled: []
